<main class="contenedor">
  <section class="principal">
    <h1>{{ appName }}</h1>
    <p>Yasir El Rahali · Ficha interactiva para juegos de rol de mesa</p>

    <div class="tarjeta">
      <h2>Datos del proyecto</h2>
      <ul>
        <li>Asignatura: Programació Avançada amb Angular</li>
        <li>Unidad: 1 - Preparación del entorno</li>
        <li>Angular: 22</li>
      </ul>
      <p>Projecte base llest</p>
    </div>

    <app-filtros-personajes
      [clases]="clases"
      (aplicar)="onApply($event)"
      (restablecer)="onReset()" />
    <app-personaje-lista
      [personajes]="personajesFiltrados"
      [idSeleccionado]="seleccionado?.id ?? null"
      (seleccionar)="onSeleccionar($event)" />
  </section>

  <aside class="nota">
    Hot reload funcionando
  </aside>
</main>

<router-outlet />
